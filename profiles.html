<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coll-Track login profiles</title>
  <link rel="stylesheet" href="popup.css">
  <script src="local-backend.js" defer></script>
  <script src="login-vault.js" defer></script>
  <script src="profiles.js" defer></script>
</head>
<body class="settings">
  <main>
    <h1>Login profiles</h1>
    <p>Use one profile for a school or share it across a group of portals.</p>
    <p><a href="http://127.0.0.1:46387/">Open saved checklists</a></p>
    <p><a id="resume-launch" hidden>Continue to portal</a></p>
    <p id="notice" role="status">Loading profiles…</p>
    <section id="editor" hidden>
      <button id="add-profile" type="button">New profile</button>
      <ul id="profiles"></ul>
      <form id="profile" hidden>
        <label for="profile-name">Profile name</label>
        <input id="profile-name" required maxlength="80">
        <label for="profile-hosts">School portal addresses</label>
        <textarea id="profile-hosts" required rows="3" placeholder="apply.example.org"></textarea>
        <label for="profile-email">Login email</label>
        <input id="profile-email" required type="email" autocomplete="off">
        <label for="profile-password">Login password</label>
        <input id="profile-password" type="password" autocomplete="new-password">
        <p id="password-hint" hidden>Leave the password blank to keep the saved one.</p>
        <div class="actions">
          <button>Save profile</button>
          <button id="delete-profile" type="button" hidden>Delete profile</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
